name: 功能建议 / Feature request
description: 描述使用场景与期望能力（不是具体实现方案）
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / Problem
      description: 现在的痛点、你的目录/命名习惯、媒体类型
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的能力 / Proposal
      description: 你希望产品怎么做（界面或行为）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案 / Alternatives
      description: 是否用 Komga/Kavita/Jellyfin/LANraragi 解决过？为什么不够
    validations: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认 / Constraints
      options:
        - label: 我理解「默认只读、不碰下载中文件」是硬约束
          required: true
        - label: 我理解可选外网能力（刮削/AI）必须默认关闭且由用户显式开启
          required: true
